[package]
name = "gitopo"
version = "0.1.0"
edition = "2021"
description = "A read-only git branch topology explorer for the terminal"
license = "MIT"
repository = "https://github.com/YearningAsian/gitopo"
keywords = ["git", "tui", "terminal", "visualization", "branches"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "gitopo"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
git2 = { version = "0.21" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
unicode-width = "0.2"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
