[package]
name = "gitopo"
version = "0.1.0"
edition = "2021"
description = "A read-only git branch topology explorer for the terminal"
license = "MIT"
repository = "https://github.com/YearningAsian/gitopo"
keywords = ["git", "tui", "terminal", "visualization", "branches"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "gitopo"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
# default-features = false drops libgit2's optional ssh/https network
# transports. This is a read-only, offline TUI: it must never reach the
# network. git2 0.21's default feature set is already empty (no transports were
# in the graph), so this is a zero-dependency-change lock that future-proofs the
# no-network guarantee.
git2 = { version = "0.21", default-features = false }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
unicode-width = "0.2"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
